user                            www;
worker_processes                auto;

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /var/log/nginx/access.log;
    client_max_body_size 2G;
    server {
        listen 5000;
        server_name _;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        location /api/ {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
            
            sub_filter 'Postiz' 'Planna';
            sub_filter 'postiz' 'planna';

            sub_filter '#612bd3' '#ff6600';
            sub_filter '#612ad5' '#ff751a';
            sub_filter '#D82D7E' '#ff6600';
            sub_filter '#d82d7e' '#ff6600';
            sub_filter '#fc69ff' '#ff6600';
            sub_filter '216, 45, 126' '255, 102, 0';
            sub_filter '216,45,126' '255,102,0';

            sub_filter '</head>' '<link rel="stylesheet" href="/orange.css"></head>';
            
            proxy_pass http://localhost:4200/;
            proxy_set_header Accept-Encoding "";
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
